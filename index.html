<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your London</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    /* Ericatoon Design System — tokens/colors.css, typography.css, spacing.css */
    --cream-0:#fefdfb; --cream-100:#f6f0e6; --butter-100:#f9f5db;
    --green-100:#cfe1b9; --green-200:#b5c99a; --green-300:#97a97c; --green-400:#87986a; --green-500:#6f8760; --green-900:#44523d;
    --clay-200:#d99a8a; --clay-300:#d2886a; --clay-400:#c98d72; --clay-500:#d87348;
    --taupe-300:#b9aa97;

    --surface-page:var(--cream-100); --surface-card:var(--cream-0); --surface-tint:var(--butter-100); --surface-mint:var(--green-100);
    --text-body:var(--green-900); --text-muted:var(--green-400); --text-faint:var(--taupe-300);
    --text-on-accent:var(--cream-0); --text-on-clay:var(--cream-0);
    --accent:var(--green-500); --accent-hover:var(--green-900); --accent-soft:var(--green-200);
    --highlight:var(--clay-500); --highlight-soft:var(--clay-200);
    --border:rgba(68,82,61,.16); --border-strong:rgba(68,82,61,.32);
    --focus-ring:0 0 0 3px rgba(111,135,96,.35);

    --font-display:'Jua', ui-rounded, sans-serif;
    --font-body:'Gowun Dodum', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --text-xs:12px; --text-sm:14px; --text-md:16px; --text-lg:20px; --text-xl:26px; --text-2xl:34px; --text-3xl:46px;
    --leading-tight:1.2; --leading-body:1.65; --track-display:-0.01em;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
    --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-xl:28px; --radius-pill:999px;
    --shadow-sm:0 1px 2px rgba(68,82,61,.08);
    --shadow-md:0 4px 12px rgba(68,82,61,.10);
  }
  /* single warm paper theme by design — Ericatoon has no dark variant, so this page commits to one look */

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--surface-page);
    color:var(--text-body);
    font-family:var(--font-body);
    font-size:var(--text-md);
    line-height:var(--leading-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  h1,h2,h3{
    font-family:var(--font-display);
    font-weight:400;
    letter-spacing:var(--track-display);
    margin:0;
    text-wrap:balance;
  }

  .mono{ font-family:var(--font-mono); letter-spacing:0.02em; }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); }

  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm); }

  .lang-toggle{
    position:fixed;
    top:16px;
    right:16px;
    z-index:20;
    background:var(--surface-card);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:0.74rem;
    letter-spacing:0.04em;
    padding:7px 14px;
    border-radius:var(--radius-pill);
    box-shadow:var(--shadow-sm);
    transition:border-color 150ms ease, color 150ms ease;
  }
  .lang-toggle:hover{ border-color:var(--accent); color:var(--accent-hover); }

  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .view{ flex:1; width:100%; }
  .view[hidden]{ display:none; }

  .shell{ max-width:720px; margin:0 auto; padding:0 var(--sp-5) var(--sp-8); width:100%; }

  /* ---------- intro ---------- */
  #view-intro .shell{
    display:flex;
    flex-direction:column;
    gap:var(--sp-6);
    padding-top:clamp(64px, 10vw, 96px);
  }
  .line-preview{
    position:relative;
    height:3px;
    background:var(--border);
    border-radius:var(--radius-pill);
    margin:2px 0;
  }
  .line-preview .dot{
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    transform:translate(-50%,-50%);
  }
  #view-intro h1{
    font-size:clamp(2rem, 5.5vw, 3.1rem);
    line-height:var(--leading-tight);
  }
  #view-intro h1 em{ font-style:normal; color:var(--highlight); }
  .intro-copy{
    max-width:min(68ch, 100%);
    color:var(--text-muted);
    font-size:var(--text-md);
    line-height:var(--leading-body);
    word-break:keep-all;
    overflow-wrap:normal;
  }
  .intro-meta{ display:flex; gap:18px; flex-wrap:wrap; color:var(--text-faint); }
  .intro-meta span{ font-size:0.78rem; }
  .btn-primary{
    align-self:flex-start;
    background:var(--accent);
    color:var(--text-on-accent);
    border:none;
    padding:14px 30px;
    font-size:var(--text-md);
    font-family:var(--font-body);
    font-weight:500;
    border-radius:var(--radius-pill);
    box-shadow:var(--shadow-sm);
    transition:background 150ms ease, transform 120ms ease;
  }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:active{ transform:scale(.98); }

  .area-grid-head{ margin-top:var(--sp-2); }
  .area-grid-head .eyebrow{ margin-bottom:var(--sp-3); }
  .area-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(104px, 1fr));
    gap:var(--sp-3);
  }
  .area-tile{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:var(--sp-2);
    display:flex;
    flex-direction:column;
    gap:6px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow 150ms ease, transform 150ms ease;
  }
  .area-tile:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .area-tile img{ width:100%; aspect-ratio:1/1; display:block; object-fit:cover; border-radius:var(--radius-sm); }
  .area-tile span{ font-family:var(--font-mono); font-size:11px; text-align:center; color:var(--text-body); letter-spacing:0.01em; }

  /* ---------- quiz ---------- */
  #view-quiz .shell{
    display:flex;
    flex-direction:column;
    gap:var(--sp-6);
    padding-top:clamp(56px, 9vw, 88px);
  }
  .progress{ display:flex; flex-direction:column; gap:10px; }
  .progress-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .progress-track{ position:relative; height:4px; background:var(--border); border-radius:var(--radius-pill); }
  .progress-fill{
    position:absolute; left:0; top:0;
    height:4px;
    background:var(--accent);
    border-radius:var(--radius-pill);
    width:0%;
    transition:width 260ms ease;
  }
  .progress-stations{ position:relative; top:-5px; display:flex; justify-content:space-between; }
  .station{
    width:12px; height:12px;
    border-radius:50%;
    background:var(--surface-card);
    border:2px solid var(--border);
    transition:border-color 200ms ease, background 200ms ease, transform 150ms ease;
  }
  .station.done{ background:var(--accent); border-color:var(--accent); }
  .station.current{ border-color:var(--highlight); transform:scale(1.2); }

  .question h2{ font-size:clamp(1.4rem, 3.6vw, 1.9rem); line-height:var(--leading-tight); font-weight:600; }

  .options{ display:flex; flex-direction:column; gap:var(--sp-3); }
  .option{
    display:flex;
    align-items:center;
    gap:var(--sp-3);
    width:100%;
    background:var(--surface-card);
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    padding:var(--sp-4);
    text-align:left;
    color:var(--text-body);
    font-family:var(--font-body);
    font-size:var(--text-md);
    transition:border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .option:hover{ border-color:var(--accent-soft); box-shadow:var(--shadow-sm); }
  .option.selected{ border-color:var(--accent); background:var(--surface-mint); }
  .option .letter{
    font-family:var(--font-mono);
    font-size:0.76rem;
    color:var(--text-muted);
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--surface-tint);
    display:flex; align-items:center; justify-content:center;
  }
  .option.selected .letter{ background:var(--accent); color:var(--text-on-accent); }

  .quiz-foot{ display:flex; justify-content:space-between; align-items:center; }
  .link-back{
    background:none;
    border:1.5px solid transparent;
    padding:8px 16px;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-size:0.88rem;
    border-radius:var(--radius-pill);
    transition:background 150ms ease, color 150ms ease;
  }
  .link-back:hover:not(:disabled){ background:var(--surface-tint); color:var(--text-body); }
  .link-back:disabled{ opacity:0; pointer-events:none; }

  /* ---------- result ---------- */
  #view-result .shell{ max-width:880px; padding-top:clamp(48px, 8vw, 72px); }
  .poster{
    border-radius:var(--radius-lg);
    overflow:hidden;
    display:grid;
    grid-template-columns:1.1fr 1fr;
    border:1px solid var(--border);
    box-shadow:var(--shadow-md);
  }
  @media (max-width:640px){ .poster{ grid-template-columns:1fr; } }
  .poster-copy{
    padding:var(--sp-6);
    display:flex;
    flex-direction:column;
    gap:var(--sp-4);
    background:var(--poster-wash, var(--surface-card));
    color:var(--text-body);
  }
  .poster-tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.03em;
    padding:5px 12px;
    border-radius:var(--radius-pill);
    border:1px solid var(--poster-rule, var(--border-strong));
    background:var(--surface-card);
  }
  .poster-copy h1{
    font-size:clamp(2rem, 4.6vw, 2.8rem);
    font-style:normal;
    color:var(--highlight);
    line-height:1.1;
  }
  .poster-badges{ display:flex; gap:var(--sp-4); flex-wrap:wrap; }
  .badge{ font-family:var(--font-mono); font-size:0.76rem; color:var(--text-body); }
  .badge b{
    display:block;
    font-size:0.64rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:400;
  }
  .poster-desc{ font-size:0.98rem; max-width:40ch; font-family:var(--font-body); }
  .poster-desc .hashtags{
    display:block;
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:0.76rem;
    color:var(--text-muted);
    letter-spacing:0.01em;
  }
  .poster-canvas-wrap{
    position:relative;
    min-height:260px;
    background:var(--poster-canvas-bg, var(--surface-tint));
  }
  .poster-canvas-wrap img{ width:100%; height:100%; display:block; object-fit:cover; }
  .result-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:var(--sp-5);
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-secondary{
    background:none;
    border:1.5px solid var(--accent);
    color:var(--accent);
    padding:10px 22px;
    border-radius:var(--radius-pill);
    font-family:var(--font-body);
    font-size:0.9rem;
    transition:background 150ms ease;
  }
  .btn-secondary:hover{ background:var(--surface-tint); }
  .result-note{ color:var(--text-muted); font-size:0.8rem; max-width:36ch; }
  .result-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn-save{
    background:var(--highlight);
    color:var(--text-on-clay);
    border:none;
    padding:10px 22px;
    border-radius:var(--radius-pill);
    font-family:var(--font-body);
    font-size:0.9rem;
    box-shadow:var(--shadow-sm);
    transition:opacity 150ms ease, transform 120ms ease;
  }
  .btn-save:hover{ opacity:0.9; }
  .btn-save:active{ transform:scale(.98); }
  .btn-save:disabled{ opacity:0.5; cursor:default; }
  .save-status{
    width:100%;
    margin-top:2px;
    font-size:0.74rem;
    color:var(--text-muted);
    min-height:1.1em;
    text-align:right;
  }

  .site-footer{
    text-align:center;
    padding:var(--sp-5) var(--sp-5) var(--sp-6);
    font-family:var(--font-mono), monospace;
    font-size:0.72rem;
    letter-spacing:0.02em;
    color:var(--text-faint, #b9aa97);
  }
  .site-footer a{
    color:inherit;
    text-decoration:underline;
    text-decoration-color:var(--border-strong, rgba(68,82,61,.32));
  }
  .site-footer a:hover{ color:var(--accent-hover, #44523d); }
</style>


</head>
<body>
<button class="lang-toggle mono" id="lang-toggle" type="button"></button>

<div id="app">

  <section id="view-intro" class="view">
    <div class="shell">
      <div class="eyebrow" id="intro-eyebrow"></div>
      <h1 id="intro-h1"></h1>
      <p class="intro-copy" id="intro-copy"></p>
      <div class="line-preview" id="intro-line"></div>
      <div class="intro-meta mono">
        <span id="meta-q"></span>
        <span>&middot;</span>
        <span id="meta-o"></span>
        <span>&middot;</span>
        <span id="meta-t"></span>
      </div>
      <button class="btn-primary" id="start-btn"></button>

      <div class="area-grid-head">
        <div class="eyebrow" id="area-grid-label"></div>
      </div>
      <div class="area-grid" id="area-grid"></div>
    </div>
  </section>

  <section id="view-quiz" class="view" hidden>
    <div class="shell">
      <div class="progress">
        <div class="progress-top">
          <span class="eyebrow" id="q-counter">Question 1 of 10</span>
          <span class="eyebrow" id="q-dim">&nbsp;</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-stations" id="progress-stations"></div>
      </div>
      <div class="question">
        <h2 id="q-text"></h2>
      </div>
      <div class="options" id="q-options"></div>
      <div class="quiz-foot">
        <button class="link-back" id="back-btn"></button>
        <span></span>
      </div>
    </div>
  </section>

  <section id="view-result" class="view" hidden>
    <div class="shell">
      <div class="poster" id="poster">
        <div class="poster-copy" id="poster-copy">
          <div class="eyebrow" id="r-eyebrow"></div>
          <h1 id="r-name"></h1>
          <div class="poster-badges" id="r-badges"></div>
          <div class="poster-tags" id="r-tags"></div>
          <p class="poster-desc" id="r-desc"></p>
        </div>
        <div class="poster-canvas-wrap">
          <img id="r-image" alt="">
        </div>
      </div>
      <div class="result-foot">
        <p class="result-note" id="result-note"></p>
        <div class="result-actions">
          <button class="btn-save" id="save-btn" type="button"></button>
          <button class="btn-secondary" id="retake-btn"></button>
        </div>
        <p class="save-status mono" id="save-status" aria-live="polite"></p>
      </div>
    </div>
  </section>

</div>

<footer class="site-footer">&copy; 2026 &middot; <a href="https://instagram.com/cheers.from.erica" target="_blank" rel="noopener noreferrer">@cheers.from.erica</a></footer>

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function dimRange(dim){
    var min = 0, max = 0;
    QUESTIONS.forEach(function(q){
      var vals = q.options.map(function(o){ return o.delta[dim] || 0; });
      min += Math.min.apply(Math, vals);
      max += Math.max.apply(Math, vals);
    });
    return { min:min, max:max };
  }

  function computeResult(deltas){
    var raw = {};
    DIMS.forEach(function(d){ raw[d] = 0; });
    deltas.forEach(function(delta){
      DIMS.forEach(function(d){ raw[d] += delta[d] || 0; });
    });
    var norm = {};
    DIMS.forEach(function(d){
      var range = dimRange(d);
      norm[d] = range.max > range.min ? clamp(((raw[d]-range.min)/(range.max-range.min))*10, 0, 10) : 5;
    });
    var scored = AREAS.map(function(area){
      var dist = 0;
      DIMS.forEach(function(d){ var diff = norm[d]-area.profile[d]; dist += diff*diff; });
      return { area:area, dist:dist };
    });
    scored.sort(function(a,b){ return a.dist-b.dist; });
    var close = scored.filter(function(s){ return s.dist <= scored[0].dist + 0.5; });
    if (close.length > 1){
      close.sort(function(a,b){
        var subA = Math.pow(norm.energy-a.area.profile.energy,2) + Math.pow(norm.family-a.area.profile.family,2);
        var subB = Math.pow(norm.energy-b.area.profile.energy,2) + Math.pow(norm.family-b.area.profile.family,2);
        return subA-subB;
      });
      return close[0].area;
    }
    return scored[0].area;
  }

  function buildStations(){
    var wrap = document.getElementById("progress-stations");
    wrap.innerHTML = "";

      var s = document.createElement("div");
      s.className = "station";
      wrap.appendChild(s);

  function renderQuiz(){
    var lang = state.lang;
    var q = QUESTIONS[state.qIndex];
    document.getElementById("q-counter").textContent = t().questionCounter(state.qIndex+1, QUESTIONS.length);
    document.getElementById("q-dim").textContent = q.tag[lang];
    document.getElementById("q-text").textContent = q.text[lang];
    document.getElementById("progress-fill").style.width = (state.qIndex / QUESTIONS.length * 100) + "%";

    var stations = document.querySelectorAll("#progress-stations .station");
    stations.forEach(function(st, i){
      st.classList.toggle("done", i < state.qIndex || (i === state.qIndex && !!state.answers[i]));
      st.classList.toggle("current", i === state.qIndex);
    });

    var optionsWrap = document.getElementById("q-options");
    optionsWrap.innerHTML = "";
    var selected = state.answers[state.qIndex];
    q.options.forEach(function(opt, i){
      var btn = document.createElement("button");
      btn.className = "option" + (selected && selected.optionIndex === i ? " selected" : "");
      btn.type = "button";
      btn.innerHTML = '<span class="letter">' + String.fromCharCode(97+i) + '</span><span>' + opt.label[lang] + "</span>";
      btn.addEventListener("click", function(idx, delta){
        return function(){ selectOption(idx, delta); };
      }(i, opt.delta));
      optionsWrap.appendChild(btn);
    });

    document.getElementById("back-btn").textContent = t().backBtn;
    document.getElementById("back-btn").disabled = state.qIndex === 0;
  }

  function selectOption(optionIndex, delta){
    state.answers[state.qIndex] = { optionIndex:optionIndex, delta:delta };
    renderQuiz();
    window.setTimeout(function(){
      if (state.qIndex < QUESTIONS.length-1){
        state.qIndex += 1;
        renderQuiz();
      } else {
        var deltas = state.answers.map(function(a){ return a.delta; });
        var area = computeResult(deltas);
        showView("view-result");
        renderResult(area);
      }
    }, 320);
  }

  // ---------- result ----------
  function hexToRgb(hex){
    var h = hex.replace("#","");
    var n = parseInt(h, 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }

  function renderResult(area){
    lastArea = area;
    var lang = state.lang;
    var rgb = hexToRgb(area.accent);
    var wash = "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.14)";
    var washStrong = "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.22)";
    var ruleTint = "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.45)";

    var copyEl = document.getElementById("poster-copy");
    copyEl.style.setProperty("--poster-wash", wash);
    copyEl.style.setProperty("--poster-rule", ruleTint);
    document.querySelector(".poster-canvas-wrap").style.setProperty("--poster-canvas-bg", washStrong);

    var linesText = area.linesNote ? area.linesNote[lang] : area.lines.join(" · ");
    var s = t();

    document.getElementById("r-eyebrow").textContent = s.yourMatch;
    document.getElementById("r-name").textContent = area.name;
    document.getElementById("r-badges").innerHTML =
      '<span class="badge"><b>' + s.zoneLabel + '</b>' + zoneDisplay(area.zone) + '</span>' +
      '<span class="badge"><b>' + s.lineLabel(area.lines.length>1) + '</b>' + linesText + '</span>';
    document.getElementById("r-tags").innerHTML = area.tags[lang].map(function(tg){ return '<span class="tag">'+tg+'</span>'; }).join("");
    document.getElementById("r-desc").innerHTML = area.desc.body[lang] + '<span class="hashtags">' + area.desc.tags + '</span>';
    document.getElementById("result-note").textContent = s.resultNote;
    document.getElementById("retake-btn").textContent = s.retakeBtn;
    document.getElementById("save-btn").textContent = s.saveBtn;
    document.getElementById("save-status").textContent = "";

    document.getElementById("r-image").src = area.image;
  }

  // ---------- shareable result image ----------
  function hexToRgba(hex, alpha){
    var rgb = hexToRgb(hex);
    return "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + alpha + ")";
  }

  function wrapTextLines(ctx, text, maxWidth){
    var words = text.split(/\s+/);
    var lines = [];
    var cur = "";
    words.forEach(function(w){
      var test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxWidth && cur){
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function drawWrapped(ctx, text, x, y, maxWidth, lineHeight){
    var lines = wrapTextLines(ctx, text, maxWidth);
    lines.forEach(function(line, i){ ctx.fillText(line, x, y + i*lineHeight); });
    return y + lines.length*lineHeight;
  }

  function roundRectPath(ctx, x, y, w, h, r){
    if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawChips(ctx, items, x, y, maxWidth, accentHex){
    ctx.font = '400 22px "IBM Plex Mono", monospace';
    ctx.textBaseline = "middle";
    var chipH = 46, gapX = 12, gapY = 14, padX = 18;
    var curX = x, curY = y + chipH/2;
    items.forEach(function(label){
      var tw = ctx.measureText(label).width;
      var chipW = tw + padX*2;
      if (curX + chipW > x + maxWidth && curX > x){ curX = x; curY += chipH + gapY; }
      ctx.fillStyle = "#f9f5db";
      ctx.strokeStyle = hexToRgba(accentHex, 0.45);
      ctx.lineWidth = 2;
      roundRectPath(ctx, curX, curY - chipH/2, chipW, chipH, chipH/2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#44523d";
      ctx.fillText(label, curX + padX, curY);
      curX += chipW + gapX;
    });
    ctx.textBaseline = "alphabetic";
    return curY + chipH/2;
  }

  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  function drawImageCover(ctx, img, x, y, w, h){
    var imgRatio = img.width / img.height, boxRatio = w / h;
    var sx, sy, sw, sh;
    if (imgRatio > boxRatio){
      sh = img.height;
      sw = sh * boxRatio;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / boxRatio;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function buildResultCanvas(area, lang, areaImg){
    var W = 1080, H = 1500, motifH = 520, marginX = 72, contentW = W - marginX*2;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");

    ctx.fillStyle = "#fefdfb";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = hexToRgba(area.accent, 0.22);
    ctx.fillRect(0, 0, W, motifH);

    if (areaImg) drawImageCover(ctx, areaImg, 0, 0, W, motifH);

    ctx.strokeStyle = hexToRgba(area.accent, 0.35);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, motifH); ctx.lineTo(W, motifH); ctx.stroke();

    var s = STRINGS[lang];
    var cursorY = motifH + 76;

    ctx.font = '500 22px "IBM Plex Mono", monospace';
    ctx.fillStyle = "#b9aa97";
    var eyebrowText = lang === "en" ? s.yourMatch.toUpperCase() : s.yourMatch;
    ctx.fillText(eyebrowText, marginX, cursorY);
    cursorY += 68;

    ctx.font = '400 72px "Jua", sans-serif';
    ctx.fillStyle = "#d87348";
    ctx.fillText(area.name, marginX, cursorY);
    cursorY += 56;

    var linesText = area.linesNote ? area.linesNote[lang] : area.lines.join(" · ");
    var metaText = s.zoneLabel + " " + zoneDisplay(area.zone) + "   ·   " + linesText;
    ctx.font = '400 24px "IBM Plex Mono", monospace';
    ctx.fillStyle = "#44523d";
    cursorY = drawWrapped(ctx, metaText, marginX, cursorY, contentW, 34) + 36;

    cursorY = drawChips(ctx, area.tags[lang], marginX, cursorY, contentW, area.accent) + 44;

    ctx.font = '400 30px "Gowun Dodum", sans-serif';
    ctx.fillStyle = "#44523d";
    cursorY = drawWrapped(ctx, area.desc.body[lang], marginX, cursorY, contentW, 46) + 30;

    ctx.font = '400 23px "IBM Plex Mono", monospace';
    ctx.fillStyle = "#87986a";
    drawWrapped(ctx, area.desc.tags, marginX, cursorY, contentW, 32);

    ctx.font = '500 20px "IBM Plex Mono", monospace';
    ctx.fillStyle = "#b9aa97";
    ctx.textAlign = "center";
    ctx.fillText("FIND YOUR LONDON", W/2, H - 46);
    ctx.textAlign = "left";

    return canvas;
  }

  async function getClaudeDownloadsCapability(){
    if (typeof window.claude === "undefined" || typeof window.claude.use !== "function") return null;
    try { return await window.claude.use("downloads"); } catch (e){ return null; }
  }

  async function saveBlobAsFile(filename, blob){
    // Inside the Claude Artifact viewer, a page can't trigger a browser download
    // directly — it has to hand the file to the platform's own save prompt.
    var downloads = await getClaudeDownloadsCapability();
    if (downloads){
      await downloads.save({ filename: filename, data: blob });
      return;
    }
    // On a plain deployed site (e.g. GitHub Pages) there's no such bridge —
    // a normal browser download works natively here.
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  async function handleSaveImage(){
    if (!lastArea) return;
    var btn = document.getElementById("save-btn");
    var status = document.getElementById("save-status");
    var s = t();
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = s.saveBtnBusy;
    status.textContent = "";

    try {
      if (document.fonts && document.fonts.ready){
        await document.fonts.ready;
        try {
          await Promise.all([
            document.fonts.load('400 72px "Jua"'),
            document.fonts.load('400 30px "Gowun Dodum"'),
            document.fonts.load('500 22px "IBM Plex Mono"')
          ]);
        } catch (fontErr) { /* best effort — draw with whatever is ready */ }
      }

      var areaImg = await loadImage(lastArea.image);
      var canvas = buildResultCanvas(lastArea, state.lang, areaImg);
      var blob = await new Promise(function(resolve){
        canvas.toBlob(function(b){ resolve(b); }, "image/jpeg", 0.92);
      });
      if (!blob) throw new Error("toBlob failed");

      var filename = "find-your-london-" + lastArea.name.toLowerCase().replace(/\s+/g, "-") + ".jpg";
      await saveBlobAsFile(filename, blob);
    } catch (err){
      if (!err || err.code !== "declined"){
        status.textContent = s.saveError;
      }
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  document.getElementById("save-btn").addEventListener("click", handleSaveImage);

  // ---------- language ----------
  function applyLanguage(){
    document.documentElement.lang = t().htmlLang;
    document.getElementById("lang-toggle").textContent = t().langToggle;
    renderIntroText();
    var visible = document.querySelector(".view:not([hidden])");
    if (visible && visible.id === "view-quiz") renderQuiz();
    if (visible && visible.id === "view-result" && lastArea) renderResult(lastArea);
  }

  document.getElementById("lang-toggle").addEventListener("click", function(){
    state.lang = state.lang === "ko" ? "en" : "ko";
    applyLanguage();
  });

  // ---------- wire up ----------
  document.getElementById("start-btn").addEventListener("click", function(){
    state.qIndex = 0;
    state.answers = [];
    showView("view-quiz");
    renderQuiz();
  });
  document.getElementById("back-btn").addEventListener("click", function(){
    if (state.qIndex > 0){ state.qIndex -= 1; renderQuiz(); }
  });
  document.getElementById("retake-btn").addEventListener("click", function(){
    state.qIndex = 0;
    state.answers = [];
    showView("view-intro");
  });

  buildIntroLine();
  buildStations();
  buildAreaGrid();
  applyLanguage();
})();
</script>
